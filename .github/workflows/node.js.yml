name: Node.js CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 
      - run: npm install -g corepack
      - run: corepack enable

      - name: Use Node.js latest
        uses: actions/setup-node@v4 
        with:
          node-version: latest
          check-latest: true
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Build project
        run: yarn build

      - name: Test project
        run: yarn test
